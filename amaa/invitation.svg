  <text class="ink segment" x="132" y="1340">Unfinished Manuscript</text>
  <text class="ink segment" x="132" y="1370">Project</text>
  <text class="muted detail" x="132" y="1400">The manuscript was left incomplete at</text>
  <text class="muted detail" x="132" y="1423">the time of A. M. A. Ayrookuzhiel's</text>
  <text class="muted detail" x="132" y="1446">death in 1996. It was intended to examine</text>
  <text class="muted detail" x="132" y="1469">caste identity and faith traditions in India.</text>
  <text class="muted detail" x="132" y="1492">Work has begun on the manuscript and</text>
  <text class="muted detail" x="132" y="1515">its methodology.</text>
  <text class="ink speaker" x="500" y="1380">Sunil Abraham</text>
  <line class="rule" x1="42" y1="1540" x2="858" y2="1540"/>

