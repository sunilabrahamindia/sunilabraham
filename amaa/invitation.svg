  <circle class="number" cx="106.08" cy="1380" r="21"/>
  <text class="cream-text row-number" x="106.08" y="1388">4</text>
  <text class="ink segment" x="186.71" y="1300">Presentation of</text>
  <text class="ink segment" x="186.71" y="1327">Unfinished Manuscript</text>
  <text class="ink segment" x="186.71" y="1354">Project</text>
  <text class="muted detail" x="186.71" y="1386">The manuscript was left incomplete</text>
  <text class="muted detail" x="186.71" y="1407">at the time of A. M. A. Ayrookuzhiel's</text>
  <text class="muted detail" x="186.71" y="1428">death in 1996. It was intended to</text>
  <text class="muted detail" x="186.71" y="1449">examine caste identity and faith</text>
  <text class="muted detail" x="186.71" y="1470">traditions in India. Work has begun</text>
  <text class="muted detail" x="186.71" y="1491">on the manuscript and its methodology.</text>
  <text class="ink speaker" x="707.22" y="1388">Sunil Abraham</text>
  <line class="rule" x1="59.41" y1="1535" x2="1213.59" y2="1535"/>

