  <text class="ink segment" x="186.71" y="1597">Religion and Liberation II</text>
  <text class="muted detail" x="186.71" y="1625">Following publication of the first</text>
  <text class="muted detail" x="186.71" y="1646">volume in 1996, this event marks</text>
