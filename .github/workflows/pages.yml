name: Update generated site indexes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-generated-indexes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate pages.json
        run: python scripts/generate_pages_json.py

      - name: Generate recent-changes.json
        run: python scripts/generate_recent_changes_json.py

      - name: Commit updated generated indexes
        run: |
          if git diff --quiet -- pages.json recent-changes.json; then
            echo "No generated index changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pages.json recent-changes.json
            git commit -m "Update generated indexes and recent changes feed"
            git push
          fi
