name: Refresh Recent Changes feed

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate recent changes feed
        run: python scripts/generate_recent_changes_json.py

      - name: Commit feed only when its content changes
        run: |
          if git diff --quiet -- recent-changes.json; then
            echo "Recent Changes feed is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add recent-changes.json
            git commit -m "Refresh Recent Changes feed"
            git push
          fi
