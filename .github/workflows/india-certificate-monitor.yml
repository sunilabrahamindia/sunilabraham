name: Indian website certificate monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: write

concurrency:
  group: india-certificate-monitor
  cancel-in-progress: false

jobs:
  check-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check TLS certificates
        run: python scripts/check_india_certificates.py

      - name: Commit updated results
        run: |
          if git diff --quiet -- assets/data/india-certificate-results.json; then
            echo "Certificate results have not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/india-certificate-results.json
          git commit -m "Update Indian website certificate results"
          git push
