name: Build EDRL II editorial preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ebook/edrl-ii/**"
      - "amaa/**"
      - ".github/workflows/build-edrl-ii.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pandoc and PDF engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic

      - name: Build and validate manuscript, EPUB and PDF
        run: python3 ebook/edrl-ii/build.py

      - name: Upload e-book preview files
        uses: actions/upload-artifact@v4
        with:
          name: edrl-ii-editorial-preview
          path: ebook/edrl-ii/output/edrl-ii-preview.epub
          if-no-files-found: error
          retention-days: 1
