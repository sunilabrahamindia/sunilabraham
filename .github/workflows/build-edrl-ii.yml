name: Build EDRL II essay-only e-book

on:
  workflow_dispatch:
  push:
    paths:
      - "ebook/edrl-ii/**"
      - "amaa/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pandoc and PDF engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic

      - name: Build manuscript, EPUB and PDF
        run: python3 ebook/edrl-ii/build.py

      - name: Upload e-book files
        uses: actions/upload-artifact@v4
        with:
          name: edrl-ii-essay-only-epub-pdf
          path: |
            ebook/edrl-ii/output/manuscript.md
            ebook/edrl-ii/output/edrl-ii.epub
            ebook/edrl-ii/output/edrl-ii.pdf
          if-no-files-found: error
          retention-days: 30
