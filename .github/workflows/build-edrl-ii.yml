name: Build EDRL II editorial preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ebook/edrl-ii/**"
      - "amaa/state-of-hinduism-in-2000-ad-full-text.md"
      - "amaa/religion-spirituality-and-aspirations-of-the-people-full-text.md"
      - "amaa/living-hindu-popular-religious-consciousness-full-text.md"
      - "amaa/the-church-and-the-study-of-religion.md"
      - "amaa/religions-and-the-aspirations-of-the-people.md"
      - "amaa/religion-way-salvation-ideology-oppression-full-text.md"
      - "amaa/dalit-theology-movement-counter-culture-full-text.md"
      - "amaa/dalit-liberation-some-reflections-on-their-ideological-predicament.md"
      - "amaa/the-ideological-nature-of-the-emerging-dalit-consciousness.md"
      - ".github/workflows/build-edrl-ii.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pandoc and PDF engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic

      - name: Build and validate manuscript, EPUB and PDF
        run: python3 ebook/edrl-ii/build.py

      - name: Upload e-book preview files
        uses: actions/upload-artifact@v4
        with:
          name: edrl-ii-editorial-preview
          path: ebook/edrl-ii/output/edrl-ii-preview.epub
          if-no-files-found: error
