# Manual build trigger: rerun requested on 11 November 2026.
name: Build EDRL II print preview
run-name: EDRL II print proof #${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ebook/edrl-ii/manifest.yml"
      - "ebook/edrl-ii/front-matter.md"
      - "ebook/edrl-ii/foreword.md"
      - "ebook/edrl-ii/print/**"
      - "ebook/edrl-ii/print/build.py"
      - "amaa/state-of-hinduism-in-2000-ad-full-text.md"
      - "amaa/religion-spirituality-and-aspirations-of-the-people-full-text.md"
      - "amaa/living-hindu-popular-religious-consciousness-full-text.md"
      - "amaa/the-church-and-the-study-of-religion.md"
      - "amaa/religions-and-the-aspirations-of-the-people.md"
      - "amaa/religion-way-salvation-ideology-oppression-full-text.md"
      - "amaa/dalit-theology-movement-counter-culture-full-text.md"
      - "amaa/dalit-liberation-some-reflections-on-their-ideological-predicament.md"
      - "amaa/the-ideological-nature-of-the-emerging-dalit-consciousness.md"
      - ".github/workflows/build-edrl-ii-print.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache print-build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/edrl-print/typst
          key: \${{ runner.os }}-edrl-print-deps-v1

      - name: Install Python dependencies when needed
        run: |
          if ! python -c "import yaml, bs4" >/dev/null 2>&1; then
            python -m pip install --upgrade PyYAML beautifulsoup4
          else
            echo "Python print dependencies are already available."
          fi

      - name: Install system tools only when needed
        run: |
          missing=0
          command -v pandoc >/dev/null 2>&1 || missing=1
          command -v pdftotext >/dev/null 2>&1 || missing=1
          command -v pdfunite >/dev/null 2>&1 || missing=1
          if ! fc-match "Linux Libertine O" | grep -qi "Linux Libertine"; then
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            sudo apt-get update
            sudo apt-get install -y pandoc fonts-linuxlibertine poppler-utils
          else
            echo "Pandoc, Poppler and Linux Libertine are already available."
          fi

      - name: Install or reuse cached Typst
        run: |
          mkdir -p "$HOME/.cache/edrl-print/typst"
          if [ ! -x "$HOME/.cache/edrl-print/typst/typst" ]; then
            curl -fsSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz -o /tmp/typst.tar.xz
            tar -xJf /tmp/typst.tar.xz -C /tmp
            install /tmp/typst-x86_64-unknown-linux-musl/typst "$HOME/.cache/edrl-print/typst/typst"
          else
            echo "Using cached Typst binary."
          fi
          echo "$HOME/.cache/edrl-print/typst" >> "$GITHUB_PATH"
          export PATH="$HOME/.cache/edrl-print/typst:$PATH"
          typst --version

      - name: Build A5 print preview
        run: python ebook/edrl-ii/print/build.py

      - name: Upload print preview
        uses: actions/upload-artifact@v4
        with:
          name: edrl-ii-print-preview-${{ github.run_number }}
          path: |
            ebook/edrl-ii/print/output/edrl-ii-interior.pdf
            ebook/edrl-ii/print/output/edrl-ii-front-cover-proof.pdf
            ebook/edrl-ii/print/output/edrl-ii-combined-review.pdf
          if-no-files-found: error
          retention-days: 30