name: Fix Simulation #1 embedding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-simulation1.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert Simulation #1 to a real embedded Markdown page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('tito/s1.md')
          s = p.read_text(encoding='utf-8')
          marker = '\n---\n'
          head, body = s.split(marker, 1)
          body = body.lstrip('\n')
          lines = body.splitlines()
          while lines and lines[0].strip() == '':
              lines.pop(0)
          body = '\n'.join(line[4:] if line.startswith('    ') else line for line in lines)
          body = body.replace('<!DOCTYPE html>\n', '')
          body = re.sub(r'<html[^>]*>\n?', '', body)
          body = re.sub(r'<head>.*?</head>\n?', '', body, flags=re.S)
          body = re.sub(r'<body>\n?', '', body)
          body = re.sub(r'\n?</body>\n?</html>\s*$', '', body)
          body = body.replace('Tito S1', 'Simulation #1').replace('TITOS1', 'SIMULATION1')
          body = body.replace(':root {', '#simulation-1 {', 1)
          compact_css = '''
          /* MOBILE-FIRST COMPACT HUD */
          #simulation-1 .top-bar {
              align-items: center;
              gap: 0.5rem;
          }
          #simulation-1 .stats-hud {
              flex: 1 1 auto;
              min-width: 0;
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 0.45rem 0.75rem;
              padding: 0.6rem 0.7rem;
          }
          #simulation-1 .stat-block { min-width: 0; }
          #simulation-1 .stat-label {
              font-size: 0.65rem;
              margin-bottom: 0.1rem;
          }
          #simulation-1 .stat-value { font-size: 1rem; }
          #simulation-1 .controls-toggle {
              width: auto !important;
              flex: 0 0 auto;
              min-width: 4.2rem;
              padding: 0.55rem 0.7rem;
          }
          @media (min-width: 769px) {
              #simulation-1 .stats-hud {
                  grid-template-columns: repeat(4, minmax(0, 1fr));
                  gap: 0.6rem 1.2rem;
              }
              #simulation-1 .stat-value { font-size: 1.1rem; }
          }
          '''
          body = body.replace('</style>', compact_css + '\n</style>', 1)
          p.write_text(head + marker + '\n' + body.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Commit page fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tito/s1.md
          git commit -m 'Fix Simulation #1 Markdown rendering' || exit 0
          git push
