name: Fix Simulation #1 embedding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-simulation1.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert Simulation #1 to a real embedded Markdown page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('tito/s1.md')
          s = p.read_text(encoding='utf-8')
          marker = '\n---\n'
          head, body = s.split(marker, 1)
          body = body.lstrip('\n')
          lines = body.splitlines()
          while lines and lines[0].strip() == '':
              lines.pop(0)
          # The previous version was indented as standalone HTML, so Markdown rendered it as raw code.
          body = '\n'.join(line[4:] if line.startswith('    ') else line for line in lines)
          body = body.replace('<!DOCTYPE html>\n', '')
          body = re.sub(r'<html[^>]*>\n?', '', body)
          body = re.sub(r'<head>.*?</head>\n?', '', body, flags=re.S)
          body = re.sub(r'<body>\n?', '', body)
          body = re.sub(r'\n?</body>\n?</html>\s*$', '', body)
          body = body.replace('Tito S1', 'Simulation #1').replace('TITOS1', 'SIMULATION1')
          p.write_text(head + marker + '\n' + body.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Commit page fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tito/s1.md
          git commit -m 'Fix Simulation #1 Markdown rendering' || exit 0
          git push
