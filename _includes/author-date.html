<hr class="author-divider">

<div class="author-box">
  <span class="author-attribution">
    <span class="author-icon" aria-hidden="true">👤</span>
    <span class="author-label">Author:</span>
    <span class="author-names">
      {% if page.authors %}
        {{ page.authors | join: ", " }}
      {% endif %}
    </span>
  </span>

  <span class="author-date-group">
    <span class="author-icon" aria-hidden="true">📅</span>
    <span class="author-label">Created:</span>
    <span class="author-date">{{ page.created | date: "%-d %B %Y" }}</span>
  </span>
</div>

<hr class="author-divider">

<style>
.author-divider {
  border: none;
  border-top: 1px solid #d0d7de;
  margin: 0.25rem 0;
}

.author-box {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  flex-wrap: nowrap;
  gap: 0.8rem;
  font-size: 1rem;
  color: #0d1a26;
  text-align: left;
  white-space: nowrap;
}

.author-attribution,
.author-date-group {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  min-width: 0;
  flex-shrink: 1;
}

.author-icon {
  color: #1f6feb;
  font-size: 1.1rem;
  flex-shrink: 0;
}

.author-label {
  font-weight: 600;
  flex-shrink: 0;
}

.author-names,
.author-date {
  font-weight: 400;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media (max-width: 600px) {
  .author-box {
    gap: 0.55rem;
    font-size: 0.95rem;
  }

  .author-attribution,
  .author-date-group {
    gap: 0.3rem;
  }
}
</style>
