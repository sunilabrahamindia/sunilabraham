<!-- =========================================================
     Categories (Wikipedia-style, boxed and only category names linked)
     ========================================================= -->
{% if page.categories %}
<style>
#catlinks {
  margin-top: 1.5em;
  padding: 0.6em 0.8em;
  border: 1px solid #ccc;
  border-radius: 4px;
  background-color: #f8f9fa;
  font-size: 0.9em;
  color: #202122;
}

#mw-normal-catlinks {
  display: inline;
}

#mw-normal-catlinks ul {
  display: inline;
  list-style: none;
  margin: 0;
  padding: 0;
}

#mw-normal-catlinks li {
  display: inline;
  margin: 0;
  padding: 0;
}

#mw-normal-catlinks li::after {
  content: ", ";  /* comma + normal space after it */
}

#mw-normal-catlinks li:last-child::after {
  content: "";           /* no comma after last item */
}

#mw-normal-catlinks a {
  color: #0645ad;
  text-decoration: none;
}

#mw-normal-catlinks a:hover {
  text-decoration: underline;
}

/* Dark mode handled globally in assets/css/darkmode.css */
</style>

<div id="catlinks" class="catlinks">
  <div id="mw-normal-catlinks" class="mw-normal-catlinks">
    <a href="{{ '/categories/' | relative_url }}">Categories</a>:
    <ul>
      {% for category in page.categories %}
        {% assign expected_title = "Category:" | append: category %}
        {% assign cat_page = site.pages | where: "title", expected_title | first %}

               <li><a href="{% if cat_page %}{{ cat_page.url | relative_url }}{% else %}{{ '/categories/' | append: category | slugify | append: '/' | relative_url }}{% endif %}">{{ category }}</a></li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endif %}
